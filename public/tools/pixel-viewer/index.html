<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Viewer - Digital Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #161615; --paper: #f8f8f8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-feature-settings: "zero", "tnum";
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  header, footer { display: flex; align-items: center; gap: 1.5rem; padding: 1rem 1.5rem; flex-wrap: wrap; }
  header { border-bottom: 1px solid var(--ink); }
  footer { border-top: 1px solid var(--ink); font-size: clamp(1rem, 2.2vw, 1.6rem); }
  .zoom { font-weight: 300; margin-left: auto; }
  button, label.btn {
    font: inherit; font-size: .85rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    background: transparent; color: var(--ink); border: 2px solid var(--ink);
    padding: .4rem 1.2rem; cursor: pointer;
  }
  button:hover, label.btn:hover { background: var(--ink); color: var(--paper); }
  button:focus-visible, label.btn:focus-within { outline: none; box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  input[type=file] { position: absolute; opacity: 0; width: 0; height: 0; }
  #stage { position: relative; min-height: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #stage.drop { outline: 4px dashed var(--ink); outline-offset: -1rem; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .swatch { width: 2.5rem; height: 2.5rem; border: 2px solid var(--ink); flex: none; }
  .ch { display: grid; line-height: 1.15; }
  .ch b { font-weight: 700; }
  .ch small { font-weight: 300; font-size: .6em; letter-spacing: .04em; }
  .hex { font-weight: 700; letter-spacing: .04em; }
  .hint { font-weight: 300; opacity: .5; font-size: .8em; }
</style>
</head>
<body>
<header>
  <label class="btn">Open image<input type="file" id="file" accept="image/*"></label>
  <button id="fit">Fit</button>
  <span class="zoom" id="zoom"></span>
</header>
<div id="stage"><canvas id="view"></canvas></div>
<footer id="readout"><span class="hint">Scroll to zoom · drag to move · hover a pixel</span></footer>
<script>
  const MAX_SIDE = 2000;
  const stage = document.getElementById('stage');
  const view = document.getElementById('view');
  const ctx = view.getContext('2d');
  const readout = document.getElementById('readout');
  const zoomLabel = document.getElementById('zoom');

  let src = document.createElement('canvas');
  let pixels = null;               // Uint8ClampedArray, RGBA per pixel
  let scale = 1, ox = 0, oy = 0;   // screen px per image px, image origin on screen (CSS px)
  let hover = null;

  // Default picture: a small sunset, so the tool works without a file.
  function sunset() {
    const w = 120, h = 150, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const sky = g.createLinearGradient(0, 0, 0, h * .62);
    sky.addColorStop(0, '#2b1a4f'); sky.addColorStop(.55, '#d9485f'); sky.addColorStop(1, '#ffb347');
    g.fillStyle = sky; g.fillRect(0, 0, w, h * .62);
    g.fillStyle = '#ffd56b'; g.beginPath(); g.arc(w / 2, h * .62, 22, Math.PI, 0); g.fill();
    const sea = g.createLinearGradient(0, h * .62, 0, h);
    sea.addColorStop(0, '#e0705a'); sea.addColorStop(1, '#1d2b4f');
    g.fillStyle = sea; g.fillRect(0, h * .62, w, h * .38);
    g.fillStyle = '#ffd56b';
    for (let y = h * .64; y < h * .85; y += 4) g.fillRect(w / 2 - 18 + (y % 7), y, 36 - (y - h * .62) * .6, 1.5);
    return c;
  }

  function load(img) {
    const k = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
    src = document.createElement('canvas');
    src.width = Math.round(img.width * k); src.height = Math.round(img.height * k);
    const g = src.getContext('2d');
    g.drawImage(img, 0, 0, src.width, src.height);
    pixels = g.getImageData(0, 0, src.width, src.height).data;
    hover = null; fit();
  }

  function size() {
    const dpr = window.devicePixelRatio || 1;
    view.width = stage.clientWidth * dpr; view.height = stage.clientHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    scale = Math.min(w / src.width, h / src.height) * .9;
    ox = (w - src.width * scale) / 2; oy = (h - src.height * scale) / 2;
    draw();
  }

  function rgb(x, y) {
    const i = (y * src.width + x) * 4;
    return [pixels[i], pixels[i + 1], pixels[i + 2]];
  }
  const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  const bin = v => v.toString(2).padStart(8, '0');
  const light = ([r, g, b]) => r * .299 + g * .587 + b * .114 > 140;

  function draw() {
    const w = stage.clientWidth, h = stage.clientHeight;
    ctx.fillStyle = '#f8f8f8'; ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingEnabled = scale < 1;
    ctx.drawImage(src, ox, oy, src.width * scale, src.height * scale);

    // visible pixel range
    const x0 = Math.max(0, Math.floor(-ox / scale)), x1 = Math.min(src.width, Math.ceil((w - ox) / scale));
    const y0 = Math.max(0, Math.floor(-oy / scale)), y1 = Math.min(src.height, Math.ceil((h - oy) / scale));

    if (scale >= 12) {
      ctx.strokeStyle = 'rgba(22,22,21,.35)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = x0; x <= x1; x++) { const sx = Math.round(ox + x * scale) + .5; ctx.moveTo(sx, oy + y0 * scale); ctx.lineTo(sx, oy + y1 * scale); }
      for (let y = y0; y <= y1; y++) { const sy = Math.round(oy + y * scale) + .5; ctx.moveTo(ox + x0 * scale, sy); ctx.lineTo(ox + x1 * scale, sy); }
      ctx.stroke();
    }

    if (scale >= 56) {
      const fs = Math.min(18, scale / 5);
      ctx.font = `700 ${fs}px 'Space Grotesk', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
        const c = rgb(x, y), cx = ox + (x + .5) * scale, cy = oy + (y + .5) * scale;
        ctx.fillStyle = light(c) ? '#161615' : '#f8f8f8';
        c.forEach((v, i) => ctx.fillText(v, cx, cy + (i - 1) * fs * 1.2));
      }
    }

    if (hover) {
      ctx.strokeStyle = '#161615'; ctx.lineWidth = 3;
      ctx.strokeRect(ox + hover.x * scale, oy + hover.y * scale, scale, scale);
      ctx.strokeStyle = '#f8f8f8'; ctx.lineWidth = 1;
      ctx.strokeRect(ox + hover.x * scale - 2, oy + hover.y * scale - 2, scale + 4, scale + 4);
    }

    zoomLabel.textContent = `${src.width} × ${src.height} px · ${scale >= 1 ? Math.round(scale) + '×' : Math.round(scale * 100) + '%'}`;
  }

  function showReadout() {
    if (!hover) { readout.innerHTML = '<span class="hint">Scroll to zoom · drag to move · hover a pixel</span>'; return; }
    const c = rgb(hover.x, hover.y);
    readout.innerHTML =
      `<span class="swatch" style="background:${hex(c)}"></span>` +
      ['R', 'G', 'B'].map((n, i) => `<span class="ch"><b>${n} ${c[i]}</b><small>${bin(c[i])}</small></span>`).join('') +
      `<span class="hex">${hex(c)}</span>` +
      `<span class="hint">pixel ${hover.x}, ${hover.y}</span>`;
  }

  function zoomAt(f, sx, sy) {
    const next = Math.min(200, Math.max(.05, scale * f));
    ox = sx - (sx - ox) * next / scale; oy = sy - (sy - oy) * next / scale;
    scale = next; draw();
  }

  // Interaction
  let drag = null;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  stage.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, ox, oy };
    stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    if (drag) { ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y; }
    const x = Math.floor((e.clientX - r.left - ox) / scale), y = Math.floor((e.clientY - r.top - oy) / scale);
    const inside = x >= 0 && y >= 0 && x < src.width && y < src.height;
    const changed = !hover !== !inside || (inside && (hover.x !== x || hover.y !== y));
    hover = inside ? { x, y } : null;
    if (changed) showReadout();
    draw();
  });
  const endDrag = () => { drag = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('pointerleave', () => { if (!drag) { hover = null; showReadout(); draw(); } });

  document.addEventListener('keydown', e => {
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    if (e.key === '+' || e.key === '=') zoomAt(1.5, cx, cy);
    else if (e.key === '-') zoomAt(1 / 1.5, cx, cy);
    else if (e.key === '0') fit();
  });

  function openFile(f) {
    if (!f || !f.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = () => { load(img); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(f);
  }
  document.getElementById('file').addEventListener('change', e => openFile(e.target.files[0]));
  document.getElementById('fit').addEventListener('click', fit);
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drop'));
  stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drop'); openFile(e.dataTransfer.files[0]); });

  window.addEventListener('resize', () => { size(); draw(); });
  size(); load(sunset());
  document.fonts && document.fonts.ready.then(draw);
</script>
</body>
</html>
