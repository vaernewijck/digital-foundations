<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Bingo - Digital Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161615;
    --paper: #f8f8f8;
    --s1: .62667rem;
    --s2: .94rem;
    --s3: 1.41rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: .875rem;
    line-height: 1.4;
    letter-spacing: .02rem;
    font-feature-settings: "zero";
    -webkit-font-smoothing: antialiased;
  }

  /* ---- shell ---- */
  .app { height: 100vh; display: grid; grid-template-rows: auto 1fr; gap: var(--s2); padding: var(--s2) var(--s3) var(--s3); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; padding-bottom: var(--s2); border-bottom: 1px solid var(--ink); }
  .brand { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
  h1 { font-size: 1.5rem; font-weight: 600; line-height: 1; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .sub { font-weight: 300; max-width: 46ch; }
  .nav { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .seedtag { font-weight: 300; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
  .seedtag b { font-weight: 700; }
  .label { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: var(--s2); align-items: baseline; flex-wrap: wrap; }
  .hint { font-size: .75rem; font-weight: 300; letter-spacing: .02rem; opacity: .75; text-transform: none; }
  kbd { font: inherit; font-weight: 700; border: 1px solid var(--ink); padding: 0 .3em; margin: 0 .1em; }

  button {
    font: inherit; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    background: transparent; color: var(--ink); border: 2px solid var(--ink);
    padding: .35rem var(--s3); cursor: pointer; white-space: nowrap;
  }
  button:hover:not([disabled]) { background: var(--ink); color: var(--paper); }
  button:active:not([disabled]) { background: transparent; color: var(--ink); }
  button[disabled] { opacity: .35; cursor: default; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover:not([disabled]) { background: transparent; color: var(--ink); }
  input[type=text], input[type=number] {
    font: inherit; font-weight: 500; letter-spacing: .05em;
    background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: .35rem var(--s2); width: 9rem;
  }
  input[type=number] { width: 5.5rem; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; }
  .seg button { padding: .35rem var(--s2); margin-right: -2px; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .ctl { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; }
  .ctl .grow { flex: 1; }

  .view { display: none; min-height: 0; }
  .view.on { display: grid; }

  /* ---- caller ---- */
  #caller.on { grid-template-rows: auto 1fr auto; gap: var(--s2); }
  .stage { border: 1px solid var(--ink); position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; padding: var(--s3); }
  .stage .corner { position: absolute; top: var(--s2); font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .stage .corner.l { left: var(--s3); }
  .stage .corner.r { right: var(--s3); font-weight: 300; font-variant-numeric: tabular-nums; }
  .stage .corner.b { top: auto; bottom: var(--s2); left: var(--s3); font-weight: 300; text-transform: none; letter-spacing: .02rem; opacity: .7; }
  .stage .corner.b.r { left: auto; right: var(--s3); }
  .center { display: flex; flex-direction: column; align-items: center; gap: var(--s3); max-width: 100%; text-align: center; }
  .prompt { font-weight: 500; line-height: 1; letter-spacing: .06em; font-variant-numeric: tabular-nums; white-space: pre-line; word-break: keep-all; }
  .prompt.s { font-size: min(22vw, 42vh); }
  .prompt.m { font-size: min(13vw, 36vh); letter-spacing: .08em; }
  .prompt.l { font-size: min(8.5vw, 30vh); }
  .prompt.x { font-size: min(9vw, 16vh); line-height: 1.15; }
  .prompt.intro { font-size: min(6vw, 14vh); font-weight: 300; letter-spacing: .02em; line-height: 1.15; }
  .prompt.intro b { font-weight: 700; }
  .answer { display: flex; flex-direction: column; align-items: center; gap: var(--s2); }
  .answer .big { font-size: min(22vw, 40vh); font-weight: 700; line-height: 1; letter-spacing: .04em; }
  .answer .sw { width: min(28vw, 34vh); aspect-ratio: 1; border: 3px solid var(--ink); }
  .answer .nm { font-size: min(6vw, 10vh); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; line-height: 1; }
  .also { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s1) var(--s3); font-size: min(2.4vw, 4.5vh); font-weight: 300; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .also span { border-top: 1px solid var(--ink); padding-top: .3rem; white-space: nowrap; }
  .also span b { font-weight: 600; font-size: .6em; letter-spacing: .15em; text-transform: uppercase; margin-right: .5em; vertical-align: .15em; }
  .reveal { animation: pop .18s steps(3, end) 1; }
  @keyframes pop { from { opacity: 0; } }

  .history { display: flex; gap: var(--s1); overflow-x: auto; padding-top: var(--s2); border-top: 1px solid var(--ink); min-height: 2.6rem; scrollbar-width: thin; }
  .history:empty::before { content: 'Nothing called yet.'; font-weight: 300; opacity: .6; align-self: center; }
  .chip { border: 1px solid var(--ink); padding: .2rem .55rem; font-size: .8rem; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: .4rem; font-variant-numeric: tabular-nums; letter-spacing: .04em; flex: none; }
  .chip .i { font-weight: 300; opacity: .55; font-size: .7rem; }
  .chip .dot { width: .8rem; height: .8rem; border: 1px solid var(--ink); display: inline-block; }
  .chip.cur { background: var(--ink); color: var(--paper); }
  .chip.cur .dot { border-color: var(--paper); }

  /* ---- cards & check ---- */
  #cards.on, #check.on { grid-template-rows: auto 1fr; gap: var(--s2); }
  .sheet { overflow: auto; min-height: 0; padding-bottom: var(--s3); }
  .card { width: 186mm; max-width: 100%; margin: 0 auto var(--s3); border: 2px solid var(--ink); padding: 7mm 8mm; background: var(--paper); page-break-after: always; break-after: page; }
  .card:last-child { page-break-after: auto; break-after: auto; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 2mm; margin-bottom: 4mm; }
  .card-head h2 { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
  .card-head .meta { font-size: .75rem; font-weight: 300; letter-spacing: .1em; text-transform: uppercase; }
  .card-head .meta b { font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); border: 2px solid var(--ink); width: 160mm; margin: 0 auto; }
  .cell { aspect-ratio: 1; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 2.1rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .02em; position: relative; text-align: center; }
  .cell.free { background: var(--ink); color: var(--paper); font-size: 1.1rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .cell.col { grid-template-rows: 1fr auto; padding: 4mm 0 2.5mm; gap: 1.5mm; }
  .cell .sw { width: 15mm; height: 15mm; border: 1px solid var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cell .nm { font-size: .6rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .cell .hex { display: none; }
  .cell.hit::after { content: ''; position: absolute; inset: 0; border: 4px solid var(--ink); pointer-events: none; }
  .cell.hit { background: rgba(22, 22, 21, .08); }
  .cell.free.hit { background: var(--ink); }
  .cell.miss { opacity: .3; }

  .help { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 5mm; margin-top: 3mm; font-size: .65rem; }
  .help .blk { border-top: 1px solid var(--ink); padding-top: 1.5mm; }
  .help .blk.wide { grid-column: 1 / -1; }
  .help .t { font-size: .6rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1.2mm; }
  .help .t small { font-weight: 300; letter-spacing: .04em; text-transform: none; margin-left: .6em; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  .bits td { border: 1px solid var(--ink); text-align: center; height: 5.4mm; font-size: .7rem; font-weight: 600; letter-spacing: .04em; }
  .bits td.eq { border: none; width: 12mm; text-align: right; font-weight: 300; padding-right: 1.5mm; }
  .bits tr.blank td { font-weight: 400; }
  .bits tr.blank td.eq { border-bottom: 1px solid var(--ink); }
  .hex16 td { border: 1px solid var(--ink); text-align: center; padding: .3mm 0; line-height: 1.15; }
  .hex16 td b { display: block; font-size: .75rem; font-weight: 700; }
  .hex16 td i { font-style: normal; font-weight: 300; display: block; font-size: .55rem; letter-spacing: .05em; }
  .ascii td { border: 1px solid var(--ink); text-align: center; padding: .3mm 0; line-height: 1.15; }
  .ascii td b { display: block; font-size: .75rem; font-weight: 700; }
  .ascii td i { font-style: normal; font-weight: 300; display: block; font-size: .55rem; letter-spacing: .03em; }
  .rgbhint { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: baseline; font-weight: 300; }
  .rgbhint b { font-weight: 700; }
  .rgbhint .seg8 { display: inline-flex; border: 1px solid var(--ink); }
  .rgbhint .seg8 span { padding: .2mm 1.4mm; border-right: 1px solid var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .rgbhint .seg8 span:last-child { border-right: none; }

  .status { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .status .pill { border: 2px solid var(--ink); padding: .3rem var(--s2); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; }
  .status .pill.yes { background: var(--ink); color: var(--paper); }
  .status .pill.no { opacity: .35; }

  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  @media (max-width: 960px) {
    .sub { display: none; }
    .card { width: 100%; padding: 4mm; }
    .grid { width: 100%; }
    .cell { font-size: 1.4rem; }
  }

  /* ---- print: cards only ---- */
  @page { size: A4 portrait; margin: 12mm; }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    .app { height: auto; display: block; padding: 0; }
    .top, .ctl, .view:not(#cards) { display: none !important; }
    #cards { display: block !important; }
    .sheet { overflow: visible; padding: 0; }
    .card { border: none; padding: 0; margin: 0; width: auto; background: #fff; }
    .grid { width: 160mm; }
    .cell.free { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Binary Bingo</h1>
      <p class="sub">The screen shows the encoding. Your card shows the meaning. Decode it, find it, mark it.</p>
    </div>
    <nav class="nav">
      <span class="seedtag">Seed <b id="seedtag">devine</b></span>
      <div class="seg" id="viewseg">
        <button data-view="caller">Caller</button>
        <button data-view="cards">Cards</button>
        <button data-view="check">Check</button>
      </div>
    </nav>
  </header>

  <!-- ============ CALLER ============ -->
  <section class="view" id="caller">
    <div class="ctl">
      <span class="label">Level</span>
      <div class="seg" id="levelseg">
        <button data-level="1">1 · Binary</button>
        <button data-level="2">2 · Hex</button>
        <button data-level="3">3 · Mix</button>
      </div>
      <span class="label" style="margin-left: var(--s2)">Show as</span>
      <div class="seg" id="repseg"></div>
      <span class="grow"></span>
      <button id="btnCat">Hide type</button>
      <button id="btnFull">Fullscreen</button>
      <button id="btnReset">Reset game</button>
    </div>
    <div class="stage" id="stage"></div>
    <div class="history" id="history"></div>
  </section>

  <!-- ============ CARDS ============ -->
  <section class="view" id="cards">
    <div class="ctl">
      <span class="label">Cards</span>
      <input type="number" id="inN" min="1" max="200" value="30">
      <span class="label">Seed</span>
      <input type="text" id="inSeed" value="devine" spellcheck="false">
      <button id="btnGen">Generate</button>
      <span class="hint">Same seed = same cards. Use the same seed in the caller.</span>
      <span class="grow"></span>
      <button class="primary" id="btnPrint">Print</button>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <!-- ============ CHECK ============ -->
  <section class="view" id="check">
    <div class="ctl">
      <span class="label">Card number</span>
      <input type="number" id="inCard" min="1" value="1">
      <button id="btnCheck">Check</button>
      <span class="hint" id="checkhint"></span>
      <span class="grow"></span>
      <div class="status" id="status"></div>
    </div>
    <div class="sheet" id="checksheet"></div>
  </section>
</div>

<script>
/* ================= POOL ================= */
const bin8 = n => n.toString(2).padStart(8, '0');
const nib = s => s.replace(/(\d{4})(?=\d)/g, '$1 ');
const hx2 = n => n.toString(16).toUpperCase().padStart(2, '0');

const NUMS = [1,2,3,5,7,8,10,12,15,16,21,25,31,42,50,64,65,100,127,128,170,200,240,255];
const COLS = [
  ['red','#FF0000'], ['green','#00FF00'], ['blue','#0000FF'], ['yellow','#FFFF00'],
  ['magenta','#FF00FF'], ['cyan','#00FFFF'], ['black','#000000'], ['white','#FFFFFF'],
  ['grey','#808080'], ['orange','#FFA500'], ['purple','#800080'], ['pink','#FF69B4'],
];

const POOL = [];
NUMS.forEach(n => POOL.push({ id: 'n' + n, cat: 'NUM', answer: String(n), reps: { BIN: nib(bin8(n)), HEX: '0x' + hx2(n) } }));
for (let c = 65; c <= 90; c++) {
  const ch = String.fromCharCode(c);
  POOL.push({ id: 'c' + ch, cat: 'CHR', answer: ch, reps: { BIN: nib(bin8(c)), HEX: '0x' + hx2(c), DEC: String(c) } });
}
COLS.forEach(([name, hex]) => {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  POOL.push({ id: 'k' + name, cat: 'COL', answer: hex, name, reps: { RGB: `rgb(${r}, ${g}, ${b})`, HEX: hex, BIN: [r, g, b].map(v => nib(bin8(v))).join('\n') } });
});
const BY_ID = Object.fromEntries(POOL.map(p => [p.id, p]));
const CAT = { NUM: 'Number', CHR: 'Letter', COL: 'Colour' };
const REPNAME = { BIN: 'Binary', HEX: 'Hex', DEC: 'Decimal', RGB: 'RGB' };
const LEVEL = { 1: { NUM: 'BIN', CHR: 'BIN', COL: 'RGB' }, 2: { NUM: 'HEX', CHR: 'HEX', COL: 'HEX' } };
const QUOTA = { NUM: 10, CHR: 9, COL: 5 };

/* ================= RNG ================= */
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rngFor = key => mulberry32(xmur3(key)());
function shuffle(arr, rng) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= GENERATION ================= */
function makeCard(seed, i) {
  const rng = rngFor(seed + ':card:' + i);
  let cells = [];
  for (const cat in QUOTA) cells.push(...shuffle(POOL.filter(p => p.cat === cat), rng).slice(0, QUOTA[cat]));
  cells = shuffle(cells, rng);
  cells.splice(12, 0, null);
  return cells;
}
const callOrder = seed => shuffle(POOL, rngFor(seed + ':calls'));
const mixRep = (seed, pos, item) => { const keys = Object.keys(item.reps); return keys[Math.floor(rngFor(seed + ':rep:' + pos)() * keys.length)]; };

/* ================= ROUTE & STATE ================= */
const VIEWS = ['caller', 'cards', 'check'];
function route() {
  const h = location.hash.slice(1) || 'caller';
  const [v, q = ''] = h.split('?');
  const p = new URLSearchParams(q);
  return { view: VIEWS.includes(v) ? v : 'caller', seed: (p.get('seed') || 'devine').trim() || 'devine', n: Math.max(1, +p.get('n') || 30), card: Math.max(1, +p.get('card') || 1) };
}
function go(view, params = {}) {
  const r = route();
  const p = new URLSearchParams({ seed: r.seed, ...params });
  location.hash = view + '?' + p.toString();
}
const KEY = seed => 'binary-bingo:' + seed;
const DEFAULT = () => ({ level: 1, pos: -1, revealed: false, hideCat: false, rep: null });
function loadState(seed) { try { return { ...DEFAULT(), ...JSON.parse(localStorage.getItem(KEY(seed)) || '{}') }; } catch { return DEFAULT(); } }
function saveState(seed, s) { try { localStorage.setItem(KEY(seed), JSON.stringify(s)); } catch {} }

/* ================= CALLER ================= */
const $ = id => document.getElementById(id);
let S = null, ORDER = [], SEED = 'devine';

function currentRep(item) {
  if (S.rep && item.reps[S.rep]) return S.rep;
  if (S.level === 3) return mixRep(SEED, S.pos, item);
  return LEVEL[S.level][item.cat];
}
function sizeClass(text) {
  if (text.includes('\n')) return 'x';
  if (text.length <= 5) return 's';
  if (text.length <= 10) return 'm';
  return 'l';
}
function answerHTML(item, big) {
  if (item.cat === 'COL') return `<div class="sw" style="background:${item.answer}"></div><div class="nm">${item.name}</div>`;
  return `<div class="big">${item.answer}</div>`;
}
function alsoHTML(item) {
  const parts = [];
  if (item.cat === 'CHR') parts.push(['ASCII', item.reps.DEC]);
  for (const k of ['BIN', 'HEX', 'RGB']) if (item.reps[k]) parts.push([REPNAME[k], item.reps[k].replace(/\n/g, '  ')]);
  return parts.map(([k, v]) => `<span><b>${k}</b>${v}</span>`).join('');
}
function renderCaller() {
  const stage = $('stage'), hist = $('history');
  $('levelseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.level === S.level));
  $('btnCat').textContent = S.hideCat ? 'Show type' : 'Hide type';
  const total = ORDER.length;
  const item = S.pos >= 0 ? ORDER[S.pos] : null;

  // show-as segment
  const rs = $('repseg');
  rs.innerHTML = '';
  if (item) {
    const cur = currentRep(item);
    for (const k of Object.keys(item.reps)) {
      const b = document.createElement('button');
      b.textContent = REPNAME[k]; b.dataset.rep = k; b.classList.toggle('on', k === cur);
      b.onclick = () => { S.rep = k; commit(); };
      rs.appendChild(b);
    }
  }

  // stage
  if (!item) {
    stage.innerHTML = `<div class="center"><div class="prompt intro">Seed <b>${SEED}</b><br>${total} calls · press <b>→</b> to start</div></div>
      <div class="corner b">Keys: <kbd>→</kbd> reveal / next &nbsp; <kbd>←</kbd> back &nbsp; <kbd>H</kbd> hide type &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>C</kbd> check a card</div>`;
  } else {
    const rep = currentRep(item);
    const text = item.reps[rep];
    const cat = S.hideCat ? '' : `<div class="corner l">${CAT[item.cat]}${S.revealed ? '' : ' · ' + REPNAME[rep]}</div>`;
    const body = S.revealed
      ? `<div class="center reveal"><div class="answer">${answerHTML(item)}</div><div class="also">${alsoHTML(item)}</div></div>`
      : `<div class="center"><div class="prompt ${sizeClass(text)}">${text}</div></div>`;
    const done = S.pos === total - 1 && S.revealed;
    stage.innerHTML = `${cat}<div class="corner r">${S.pos + 1} / ${total}</div>${body}
      <div class="corner b">${done ? 'All items called. Press <kbd>C</kbd> to check cards.' : (S.revealed ? '<kbd>→</kbd> next' : '<kbd>→</kbd> reveal')}</div>`;
  }

  // history
  hist.innerHTML = '';
  for (let i = 0; i <= S.pos; i++) {
    const it = ORDER[i], isCur = i === S.pos, show = !isCur || S.revealed;
    const el = document.createElement('span');
    el.className = 'chip' + (isCur ? ' cur' : '');
    if (!show) el.innerHTML = `<span class="i">${i + 1}</span>${it.reps[currentRep(it)].replace(/\n/g, ' ')}`;
    else if (it.cat === 'COL') el.innerHTML = `<span class="i">${i + 1}</span><span class="dot" style="background:${it.answer}"></span>${it.name}`;
    else el.innerHTML = `<span class="i">${i + 1}</span>${it.answer}`;
    hist.appendChild(el);
  }
  hist.scrollLeft = hist.scrollWidth;
}
function commit() { saveState(SEED, S); renderCaller(); }
function next() {
  if (S.pos < 0) { S.pos = 0; S.revealed = false; S.rep = null; }
  else if (!S.revealed) S.revealed = true;
  else if (S.pos < ORDER.length - 1) { S.pos++; S.revealed = false; S.rep = null; }
  commit();
}
function prev() {
  if (S.pos < 0) return;
  if (S.revealed) { S.revealed = false; }
  else if (S.pos > 0) { S.pos--; S.revealed = true; S.rep = null; }
  else { S.pos = -1; }
  commit();
}

$('levelseg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.level = +b.dataset.level; S.rep = null; commit(); });
$('btnCat').onclick = () => { S.hideCat = !S.hideCat; commit(); };
$('btnFull').onclick = toggleFull;
$('btnReset').onclick = () => { S = DEFAULT(); commit(); };
$('stage').addEventListener('click', () => next());
function toggleFull() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }

addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const r = route();
  if (e.key === 'c' || e.key === 'C') { go('check'); return; }
  if (r.view !== 'caller') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'h' || e.key === 'H') { S.hideCat = !S.hideCat; commit(); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === '1' || e.key === '2' || e.key === '3') { S.level = +e.key; S.rep = null; commit(); }
});

/* ================= CARDS ================= */
const HELP = (() => {
  const bits = [128, 64, 32, 16, 8, 4, 2, 1];
  const bitTable = `<table class="bits"><tr>${bits.map(b => `<td>${b}</td>`).join('')}<td class="eq"></td></tr>
    ${[1, 2].map(() => `<tr class="blank">${bits.map(() => '<td></td>').join('')}<td class="eq">=</td></tr>`).join('')}</table>`;
  const hexRows = [0, 8].map(o => `<tr>${Array.from({ length: 8 }, (_, i) => { const v = o + i; return `<td><b>${v.toString(16).toUpperCase()}</b><i>${v} · ${v.toString(2).padStart(4, '0')}</i></td>`; }).join('')}</tr>`).join('');
  const asciiRows = [65, 78].map(o => `<tr>${Array.from({ length: 13 }, (_, i) => { const c = o + i; return `<td><b>${String.fromCharCode(c)}</b><i>${c}<br>${hx2(c)}</i></td>`; }).join('')}</tr>`).join('');
  return `<div class="help">
    <div class="blk wide"><div class="t">Bit values <small>write the bits under their value, add up the ones</small></div>${bitTable}</div>
    <div class="blk wide"><div class="t">Hex digits <small>one hex digit = one nibble = 4 bits · 0x2A = 0010 1010 = 42</small></div><table class="hex16">${hexRows}</table></div>
    <div class="blk wide"><div class="t">ASCII <small>A = 65 = 0x41 = 0100 0001 · the next letter is one higher</small></div><table class="ascii">${asciiRows}</table></div>
    <div class="blk wide"><div class="t">Colour <small>#RRGGBB · one byte each for red, green, blue</small></div>
      <div class="rgbhint"><span class="seg8"><span>FF = 255 = full</span><span>80 = 128 = half</span><span>00 = none</span></span>
      <span><b>#FF0000</b> full red, no green, no blue → red</span></div></div>
  </div>`;
})();

function cellHTML(item, cls) {
  if (!item) return `<div class="cell free ${cls}">Free</div>`;
  if (item.cat === 'COL') return `<div class="cell col ${cls}"><div class="sw" style="background:${item.answer}"></div><div class="nm">${item.name}</div></div>`;
  return `<div class="cell ${cls}">${item.answer}</div>`;
}
function cardHTML(seed, i, cells, called) {
  const grid = cells.map(c => cellHTML(c, called ? (!c || called.has(c.id) ? 'hit' : 'miss') : '')).join('');
  return `<article class="card">
    <div class="card-head"><h2>Binary Bingo</h2><span class="meta">Digital Foundations · Week 1</span><span class="meta">Card <b>${String(i).padStart(2, '0')}</b> · seed <b>${seed}</b></span></div>
    <div class="grid">${grid}</div>${called ? '' : HELP}</article>`;
}
function renderCards(r) {
  $('inN').value = r.n; $('inSeed').value = r.seed;
  let html = '';
  for (let i = 1; i <= r.n; i++) html += cardHTML(r.seed, i, makeCard(r.seed, i));
  $('sheet').innerHTML = html;
}
$('btnGen').onclick = () => { const seed = $('inSeed').value.trim() || 'devine'; location.hash = 'cards?' + new URLSearchParams({ seed, n: $('inN').value }); };
$('inSeed').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnGen').click(); });
$('inN').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnGen').click(); });
$('btnPrint').onclick = () => print();

/* ================= CHECK ================= */
const LINES = [];
for (let i = 0; i < 5; i++) { LINES.push([0, 1, 2, 3, 4].map(j => i * 5 + j)); LINES.push([0, 1, 2, 3, 4].map(j => j * 5 + i)); }
LINES.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]);

function renderCheck(r) {
  $('inCard').value = r.card;
  const st = loadState(r.seed), order = callOrder(r.seed);
  const called = new Set(order.slice(0, st.pos + 1).map(p => p.id));
  const cells = makeCard(r.seed, r.card);
  const hit = i => !cells[i] || called.has(cells[i].id);
  const lines = LINES.filter(l => l.every(hit)).length;
  const full = cells.every((_, i) => hit(i));
  const marked = cells.filter((c, i) => c && hit(i)).length;
  $('checkhint').textContent = `${called.size} of ${order.length} called · ${marked} of 24 cells hit`;
  $('status').innerHTML = `<span class="pill ${lines ? 'yes' : 'no'}">${lines ? `Line ✓ ×${lines}` : 'No line'}</span><span class="pill ${full ? 'yes' : 'no'}">${full ? 'Full card ✓' : 'Not full'}</span>`;
  $('checksheet').innerHTML = cardHTML(r.seed, r.card, cells, called);
}
$('btnCheck').onclick = () => go('check', { card: $('inCard').value });
$('inCard').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnCheck').click(); });

/* ================= ROUTER ================= */
$('viewseg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.view); });
function render() {
  const r = route();
  SEED = r.seed;
  $('seedtag').textContent = SEED;
  VIEWS.forEach(v => $(v).classList.toggle('on', v === r.view));
  $('viewseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.view === r.view));
  if (r.view === 'caller') { S = loadState(SEED); ORDER = callOrder(SEED); renderCaller(); }
  else if (r.view === 'cards') renderCards(r);
  else renderCheck(r);
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
