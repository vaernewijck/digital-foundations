<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo - Digital Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161615;
    --paper: #ffffff;
    --s2: .94rem;
    --s3: 1.41rem;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: .875rem;
    line-height: 1.4;
    letter-spacing: .02rem;
    font-feature-settings: "zero", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  /* ---- shell ---- */
  .app { min-height: 100vh; padding: var(--s3) 3rem; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
  .nav { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .count { font-size: .75rem; font-weight: 500; letter-spacing: .12em; padding: .2rem 0; opacity: .5; }

  button {
    font: inherit; font-size: .75rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
    background: none; color: var(--ink); border: 0; padding: .2rem 0;
    cursor: pointer; white-space: nowrap; opacity: .5;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em;
    transition: opacity .15s ease;
  }
  button:hover:not([disabled]), button.on { opacity: 1; }
  button[disabled] { opacity: .2; cursor: default; text-decoration: none; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* ---- stage ---- */
  .stage { flex: 1; display: grid; place-items: center; align-content: center; gap: 2.5rem; cursor: pointer; user-select: none; text-align: center; }
  .type { font-size: min(2.4vw, 1.5rem); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; opacity: .6; min-height: 1.4em; }
  .code { font-size: min(11vw, 28vh); font-weight: 500; line-height: 1; letter-spacing: .04em; white-space: nowrap; }
  .code.intro { font-size: min(5vw, 12vh); font-weight: 300; }
  .code span { display: inline-block; }
  .hint { font-size: .75rem; font-weight: 300; opacity: .5; min-height: 1.4em; }

  /* timer: a thin line that runs out, it only signals (the teacher still presses Next) */
  .timer { width: min(60vw, 40rem); height: 3px; background: #e8e8e7; visibility: hidden; }
  .timer.on { visibility: visible; }
  .timer i { display: block; height: 100%; background: var(--ink); transform-origin: left; }
  .timer.on i { animation: run var(--t, 30s) linear forwards; }
  @keyframes run { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* ---- called ---- */
  .called { display: none; flex: 1; align-content: start; grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr)); gap: var(--s2) var(--s3); padding-top: 3rem; }
  .app.list .called { display: grid; }
  .app.list .stage { display: none; }
  .called span { font-family: 'Space Grotesk', system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji'; font-size: 1.75rem; font-weight: 300; line-height: 1; text-align: center; }
  .called span small { display: block; font-size: .625rem; letter-spacing: .12em; opacity: .5; margin-top: .4rem; }
  .called:empty::before { content: 'Nothing called yet.'; font-weight: 300; opacity: .5; }

  /* ---- bingo! ---- */
  .bingo { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: var(--ink); color: var(--paper); cursor: pointer; }
  .bingo.on { display: grid; }
  .bingo div { font-size: min(20vw, 40vh); font-weight: 700; line-height: 1; letter-spacing: .04em; white-space: nowrap; }
  .bingo span { display: inline-block; }

  @media (max-width: 480px) {
    .app { padding: var(--s2) 1rem; }
    .code { font-size: 12vw; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="count" id="count"></span>
    <nav class="nav">
      <button id="back" type="button">Back</button>
      <button id="next" type="button">Next</button>
      <button id="list" type="button">Called</button>
      <button id="bingo-btn" type="button">Bingo</button>
      <button id="sound" type="button">Sound on</button>
      <button id="reset" type="button">Reset</button>
    </nav>
  </header>

  <main class="stage" id="stage" aria-live="polite">
    <div class="type" id="type"></div>
    <div class="code" id="code"></div>
    <div class="timer" id="timer"><i></i></div>
    <p class="hint" id="hint"></p>
  </main>

  <section class="called" id="called" aria-label="Called so far"></section>
  <div class="bingo" id="bingo" aria-live="assertive"><div id="bingo-word"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="bingo.js"></script>
<script>
(() => {
  // ?seed=devine must match the seed the cards were printed with, ?t=20 sets the timer (0 = off)
  const params = new URLSearchParams(location.search);
  const seed = Bingo.seedFrom(params);
  const seconds = params.has('t') ? Math.max(0, +params.get('t') || 0) : 30;
  let state = Bingo.load(seed);
  let order = Bingo.calls(seed, state.round);

  const $ = id => document.getElementById(id);
  const app = $('app');
  const STEP = 0.07;   // seconds between digits, for both the animation and the blips
  const motion = !!window.gsap && !matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- sound: synthesised, no files ---- */
  const SOUND_KEY = 'bingo:sound';
  let soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch {}
  let ctx = null;
  function tone(freq, at = 0, dur = .08, type = 'square', vol = .04) {
    if (!soundOn) return;
    ctx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime + at;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }
  const sound = {
    // you hear the byte: a 1 is high, a 0 is low
    code: text => [...text].forEach((ch, i) => tone(ch === '1' ? 880 : ch === '0' ? 440 : 660, i * STEP)),
    back: () => tone(220, 0, .1),
    time: () => { tone(330, 0, .15, 'triangle', .07); tone(247, .18, .3, 'triangle', .07); },
    bingo: () => {
      [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .1, .18, 'square', .05));
      [523, 659, 784, 1047].forEach(f => tone(f, .65, 1.2, 'triangle', .06));
    },
  };

  /* ---- drawing ---- */
  function showCode(text, animate) {
    const el = $('code');
    el.replaceChildren(...[...text].map(ch => Object.assign(document.createElement('span'), { textContent: ch })));
    if (!animate) return;
    sound.code(text);
    if (motion) gsap.from(el.children, { yPercent: -80, opacity: 0, duration: .3, stagger: STEP, ease: 'back.out(2.5)' });
  }

  function startTimer() {
    const el = $('timer');
    el.classList.remove('on');
    if (!seconds) return;
    void el.offsetWidth;   // restart the CSS animation
    el.style.setProperty('--t', seconds + 's');
    el.classList.add('on');
  }
  $('timer').addEventListener('animationend', () => { sound.time(); $('hint').textContent = 'Time.'; });

  // change: 'code' (a new code appeared), 'back', or nothing (redraw only)
  // the answer is never shown: decoding it is the game
  function render(change) {
    const { pos, round } = state;
    const item = order[pos];
    const roundTag = round ? ` · Round ${round + 1}` : '';
    $('count').textContent = (pos < 0 ? `Seed ${seed}` : `${pos + 1} / ${order.length}`) + roundTag;
    $('back').disabled = pos < 0;
    $('next').disabled = pos === order.length - 1;
    $('code').classList.toggle('intro', !item);

    if (!item) {
      $('type').textContent = '';
      $('timer').classList.remove('on');
      $('code').textContent = 'Bingo';
      $('hint').textContent = 'Right arrow or click to start.';
    } else {
      $('type').textContent = Bingo.TASK[item.type];
      showCode(item.code, change === 'code');
      $('hint').textContent = pos === order.length - 1 ? 'That was the last one.' : '';
      if (change) startTimer();
    }
    if (change === 'back') sound.back();

    $('called').replaceChildren(...order.slice(0, pos + 1).map((it, i) => {
      const el = document.createElement('span');
      // the current code stays a question mark: students are still decoding it
      el.innerHTML = `${i < pos ? it.answer : '?'}<small>${i + 1}</small>`;
      return el;
    }));
  }

  function commit(change) { Bingo.save(seed, state); render(change); }

  function next() {
    if (state.pos >= order.length - 1) return;
    state = { ...state, pos: state.pos + 1 };
    commit('code');
  }
  function back() {
    if (state.pos < 0) return;
    state = { ...state, pos: state.pos - 1 };
    commit('back');
  }
  function toggleList() {
    app.classList.toggle('list');
    $('list').classList.toggle('on', app.classList.contains('list'));
  }
  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch {}
    $('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  }

  // someone shouts bingo: the teacher presses B
  let bingoTl = null;
  function bingo() {
    const box = $('bingo'), word = $('bingo-word');
    if (box.classList.contains('on')) return closeBingo();
    word.replaceChildren(...[...'BINGO'].map(ch => Object.assign(document.createElement('span'), { textContent: ch })));
    box.classList.add('on');
    sound.bingo();
    binaryConfetti();
    if (!motion) return;
    bingoTl = gsap.timeline()
      .from(word.children, { yPercent: 120, opacity: 0, duration: .5, stagger: .1, ease: 'back.out(3)' })
      .to(word.children, { yPercent: -15, duration: .15, stagger: { each: .06, yoyo: true, repeat: 1 }, ease: 'power1.inOut' }, '+=.1');
  }
  // white 0s and 1s raining down on the black screen
  let bits = null;
  function binaryConfetti() {
    if (!window.confetti || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    bits ??= ['0', '1'].map(text => confetti.shapeFromText({ text, scalar: 3, color: '#ffffff', fontFamily: 'Space Grotesk' }));
    const burst = (x, angle) => confetti({ shapes: bits, scalar: 3, particleCount: 40, spread: 70, startVelocity: 55, angle, origin: { x, y: .9 }, flat: true });
    burst(.1, 60); burst(.9, 120);
    setTimeout(() => { burst(.3, 75); burst(.7, 105); }, 350);
    setTimeout(() => confetti({ shapes: bits, scalar: 3, particleCount: 80, spread: 160, startVelocity: 30, origin: { x: .5, y: -.1 }, gravity: .8, ticks: 300, flat: true }), 700);
  }
  function closeBingo() {
    window.confetti?.reset();
    bingoTl?.kill();
    $('bingo').classList.remove('on');
  }

  // arrow keys (and presenter clickers, which send Page Up/Down) step through
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;   // the button's own click handles it
    if ($('bingo').classList.contains('on')) { if (e.key !== 'b' && e.key !== 'B') { closeBingo(); return; } }
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); back(); }
    else if (e.key === 'c' || e.key === 'C') toggleList();
    else if (e.key === 'b' || e.key === 'B') bingo();
    else if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  // keep a second window (e.g. a laptop copy of the projector) in step
  addEventListener('storage', e => {
    if (e.key !== Bingo.storageKey(seed)) return;
    state = Bingo.load(seed);
    order = Bingo.calls(seed, state.round);
    render();
  });

  $('stage').addEventListener('click', next);
  $('next').addEventListener('click', next);
  $('back').addEventListener('click', back);
  $('list').addEventListener('click', toggleList);
  $('bingo-btn').addEventListener('click', bingo);
  $('bingo').addEventListener('click', closeBingo);
  $('sound').addEventListener('click', toggleSound);
  $('sound').textContent = soundOn ? 'Sound on' : 'Sound off';
  $('reset').addEventListener('click', () => {
    // a new round: same cards, a new order
    if (state.pos >= 0 && !confirm(`Start round ${state.round + 2}? Same cards, new order.`)) return;
    if (state.pos >= 0) state = { pos: -1, round: state.round + 1 };
    order = Bingo.calls(seed, state.round);
    commit();
  });
  render();
})();
</script>
</body>
</html>
