<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abacus - Digital Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161615;
    --paper: #ffffff;
    --s1: .62667rem;
    --s2: .94rem;
    --s3: 1.41rem;
    --bead: 30px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-size: .875rem;
    line-height: 1.4;
    letter-spacing: .02rem;
    font-feature-settings: "zero", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  /* ---- shell ---- */
  .app { min-height: 100vh; padding: var(--s3) 3rem; display: flex; flex-direction: column; }
  .top { flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
  h1 {
    font-size: 1.125rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: .18em;
  }
  .sub { font-size: 1rem; font-weight: 300; margin-top: .3rem; }
  .nav { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }

  button {
    font: inherit; font-size: .75rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
    background: none; color: var(--ink); border: 0; padding: .2rem 0;
    cursor: pointer; white-space: nowrap; opacity: .5;
    text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em;
    transition: opacity .15s ease;
  }
  button:hover:not([disabled]) { opacity: 1; }
  button[disabled] { opacity: .2; cursor: default; text-decoration: none; }
  button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  /* ---- stage ---- */
  .stage { flex: 1; display: grid; place-items: center; align-content: center; gap: 3rem; }
  .abacus { width: min(100%, 40rem); display: grid; }
  .row { display: grid; grid-template-columns: 4rem 1fr; align-items: center; gap: var(--s3); height: calc(var(--bead) + var(--s2)); }
  .label { text-align: right; font-size: .625rem; font-weight: 300; letter-spacing: .1em; opacity: .4; }
  .track { position: relative; height: 100%; }
  .rod { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--ink); opacity: .5; }
  .bead {
    position: absolute; top: 50%; width: var(--bead); height: var(--bead); margin-top: calc(var(--bead) / -2);
    padding: 0; border: 1px solid var(--ink); border-radius: 50%;
    background: var(--paper); opacity: 1; text-decoration: none;
    transition: left .3s ease, background-color .15s ease;
  }
  .bead:hover:not([disabled]) { background: #e8e8e7; }
  .bead.on, .bead.on:hover:not([disabled]) { background: var(--ink); }
  .bead:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .result { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
  .result-label { font-size: .625rem; font-weight: 300; letter-spacing: .18em; text-transform: uppercase; opacity: .5; }
  .result-value { font-size: 3rem; font-weight: 300; line-height: 1; letter-spacing: .04em; }
  .result-sum { font-size: 1rem; font-weight: 300; opacity: .5; min-height: 1.4em; }
  .hint { font-size: .75rem; font-weight: 300; opacity: .5; text-align: center; }

  @media (max-width: 480px) {
    :root { --bead: 24px; }
    .app { padding: var(--s2) 1rem; }
    .row { grid-template-columns: 3rem 1fr; gap: var(--s2); }
    .result-value { font-size: 2.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Abacus</h1>
      <p class="sub">Ten beads per rod. Slide beads to the right to count, back to the left to clear.</p>
    </div>
    <nav class="nav">
      <button id="add-row" type="button">Add rod (10000)</button>
      <button id="reset" type="button">Reset</button>
    </nav>
  </header>

  <main class="stage">
    <div class="abacus" id="abacus" aria-label="Decimal abacus"></div>

    <div class="result" aria-live="polite">
      <div class="result-label">Total</div>
      <div class="result-value" id="total">0</div>
      <div class="result-sum" id="sum"></div>
    </div>
    <p class="hint">Click a bead: it moves together with every bead between it and the middle.</p>
  </main>
</div>

<script>
(() => {
  const BEADS_PER_ROW = 10;
  const BEAD_GAP = 2;
  const MAX_EXTRA_ROWS = 3;
  const abacus = document.getElementById('abacus');
  const totalEl = document.getElementById('total');
  const sumEl = document.getElementById('sum');
  const addBtn = document.getElementById('add-row');

  let placeValues = [1000, 100, 10, 1];   // top rod first
  let extraRowsAdded = 0;
  const state = { 1: 0, 10: 0, 100: 0, 1000: 0 };   // beads on the right (counted) per rod

  const beadSize = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bead'));

  function buildRow(placeValue) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.value = placeValue;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = placeValue;
    const track = document.createElement('div');
    track.className = 'track';
    const rod = document.createElement('div');
    rod.className = 'rod';
    track.appendChild(rod);
    for (let i = 0; i < BEADS_PER_ROW; i++) {
      const bead = document.createElement('button');
      bead.type = 'button';
      bead.className = 'bead';
      bead.dataset.index = i;
      bead.setAttribute('aria-label', `Bead ${i + 1} on the ${placeValue} rod`);
      bead.addEventListener('click', () => clickBead(placeValue, i));
      track.appendChild(bead);
    }
    row.append(label, track);
    return row;
  }

  function updatePositions() {
    const size = beadSize();
    abacus.querySelectorAll('.row').forEach(row => {
      const placeValue = parseInt(row.dataset.value);
      const trackWidth = row.querySelector('.track').clientWidth;
      const rightCount = state[placeValue];
      const leftCount = BEADS_PER_ROW - rightCount;
      row.querySelectorAll('.bead').forEach((bead, i) => {
        const counted = i >= leftCount;
        const x = counted
          ? trackWidth - (rightCount - (i - leftCount)) * (size + BEAD_GAP)
          : i * (size + BEAD_GAP);
        bead.style.left = x + 'px';
        bead.classList.toggle('on', counted);
        bead.setAttribute('aria-pressed', counted);
      });
    });
  }

  function clickBead(placeValue, beadIndex) {
    const leftCount = BEADS_PER_ROW - state[placeValue];
    state[placeValue] = beadIndex < leftCount
      ? BEADS_PER_ROW - beadIndex          // left bead: it and everything to its right go right
      : BEADS_PER_ROW - beadIndex - 1;     // right bead: it and everything to its left go back
    updatePositions();
    updateTotal();
  }

  function updateTotal() {
    const total = placeValues.reduce((sum, pv) => sum + state[pv] * pv, 0);
    totalEl.textContent = total;
    const parts = placeValues.filter(pv => state[pv] > 0).map(pv => `${state[pv]} × ${pv}`);
    sumEl.textContent = parts.length > 1 ? parts.join(' + ') : '';
  }

  function reset() {
    placeValues.forEach(pv => state[pv] = 0);
    updatePositions();
    updateTotal();
  }

  function addRow() {
    if (extraRowsAdded >= MAX_EXTRA_ROWS) return;
    const newValue = Math.max(...placeValues) * 10;
    state[newValue] = 0;
    placeValues.unshift(newValue);
    extraRowsAdded++;
    abacus.prepend(buildRow(newValue));
    updatePositions();
    updateTotal();
    if (extraRowsAdded >= MAX_EXTRA_ROWS) addBtn.disabled = true;
    else addBtn.textContent = `Add rod (${newValue * 10})`;
  }

  placeValues.forEach(pv => abacus.appendChild(buildRow(pv)));
  updatePositions();
  updateTotal();
  document.getElementById('reset').addEventListener('click', reset);
  addBtn.addEventListener('click', addRow);
  addEventListener('resize', updatePositions);
  document.fonts?.ready.then(updatePositions);
})();
</script>
</body>
</html>
