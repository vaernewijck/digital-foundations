<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher tools - Digital Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #161615; --paper: #f8f8f8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    font-feature-settings: "tnum";
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 3rem 1.5rem;
  }
  main { width: min(100%, 60rem); display: grid; gap: 1.5rem; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  header svg { width: 3rem; height: 2rem; flex: none; margin-top: .25rem; }
  h1 { font-weight: 700; font-size: 2rem; line-height: 1.1; }
  h1 + p { font-weight: 300; margin-top: .25rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9375rem; line-height: 1.3; }
  th { font-weight: 300; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; text-align: left; padding: 0 .75rem .5rem 0; border-bottom: 1px solid rgba(22,22,21,.3); }
  td { padding: .5rem .75rem .5rem 0; border-bottom: 1px solid rgba(22,22,21,.15); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .tool { width: 30%; white-space: nowrap; }
  td span { font-weight: 300; }
  a { color: inherit; font-weight: 400; text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; padding: 0 .15em; }
  a:hover, a:focus-visible { background: var(--ink); color: var(--paper); text-decoration: none; outline: none; }
  footer { font-weight: 300; font-size: .875rem; }
  @media (max-width: 40rem) { html, body { height: auto; } .tool { white-space: normal; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Teacher tools</h1>
      <p>Helpers for preparing Digital Foundations material.</p>
    </div>
    <svg viewBox="0 0 450 300" aria-label="Devine" role="img"><path fill="currentColor" d="M300 0H0v300h300a150 150 0 0 0 0-300ZM155 290V10a140 140 0 0 1 0 280Z"/></svg>
  </header>

  <table>
    <thead>
      <tr><th>Tool</th><th>What it does</th></tr>
    </thead>
    <tbody>
      <tr>
        <td class="tool"><a href="gif-maker/">GIF maker</a></td>
        <td><span>Turn a few pictures into a looping GIF with a subtitle under each frame. Runs in the browser, nothing is uploaded.</span></td>
      </tr>
    </tbody>
  </table>

  <footer><a href="../">Back to the student tools</a></footer>
</main>
</body>
</html>
